name: nz315-production
services:
  app:
    image: ${NZ315_IMAGE:?请指定已验收的版本镜像}
    restart: unless-stopped
    network_mode: host
    command: ["node", "scripts/start-production-container.mjs"]
    environment:
      NODE_ENV: production
      HOST: "127.0.0.1"
      PORT: "${NZ315_PORT:-3100}"
      TZ: Asia/Shanghai
      NZ315_ENV_FILE: /run/secrets/nz315.env
    volumes:
      - "${NZ315_SECRET_FILE:?请指定只读正式凭据文件}:/run/secrets/nz315.env:ro,z"
      - "${NZ315_BACKUP_DIR:?请指定持久备份目录}:/app/backup:rw,z"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3100)+'/api/auth/me').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
