# ============================================================
# 农资315 · nginx 站点配置
# ------------------------------------------------------------
# 放置位置：
#   RHEL 系（Alibaba Cloud Linux / CentOS）：/etc/nginx/conf.d/nz315.conf
#     -> cp deploy/nginx-nz315.conf /etc/nginx/conf.d/nz315.conf
#   Debian / Ubuntu：/etc/nginx/sites-available/nz315.conf 并软链到 sites-enabled/
#     -> ln -s /etc/nginx/sites-available/nz315.conf /etc/nginx/sites-enabled/
# 生效：nginx -t && systemctl reload nginx
#
# 证书路径假定由 certbot 签发（见 docs/上线操作手册-阿里云.md §4.2）：
#   /etc/letsencrypt/live/www.nz315.cn/fullchain.pem
#   /etc/letsencrypt/live/www.nz315.cn/privkey.pem
# 若改用阿里云免费证书（.pem + .key 两个文件），把下面两行路径替换为实际路径。
#
# ⚠️ 本配置刻意把「非 www 域名」301 到 www：
#   微信网页授权回调域名取自请求头 Host（server/api/consumer/wechat/authorize.get.ts:15-17），
#   公众平台白名单只登记了 www.nz315.cn，用裸域名或 IP 访问会撞微信 10003。
# ============================================================

# ---------- 1) HTTP：全部跳 HTTPS，同时放行证书续期校验 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name www.nz315.cn nz315.cn;

    # Let's Encrypt 续期校验（certbot --webroot -w /var/www/certbot）
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://www.nz315.cn$request_uri;
    }
}

# ---------- 2) HTTPS 裸域名：301 到 www（保证唯一入口） ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name nz315.cn;

    ssl_certificate     /etc/letsencrypt/live/www.nz315.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nz315.cn/privkey.pem;

    return 301 https://www.nz315.cn$request_uri;
}

# ---------- 3) HTTPS 主站：反代 Nitro ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.nz315.cn;

    ssl_certificate     /etc/letsencrypt/live/www.nz315.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nz315.cn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # 追溯码文件上传：单文件上限 50MB，留余量
    client_max_body_size 60m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options        SAMEORIGIN         always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # 微信域名归属校验文件：确保返回纯文本（由 Nuxt public/ 静态托管）
    location = /MP_verify_OUOoNSqTrpZkfWli.txt {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 为将来 HMR / WebSocket 预留
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 10 万条码文件校验耗时较长，超时给足
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # SSR 流式输出，不缓冲
        proxy_buffering off;
    }
}
